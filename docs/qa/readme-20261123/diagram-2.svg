<svg aria-labelledby="chart-title-my-svg" aria-describedby="chart-desc-my-svg" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 812 858" style="max-width: 812px; background-color: white;" class="flowchart" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="100%" id="my-svg"><title id="chart-title-my-svg">Five offline research paths and a separate presentation contract</title><desc id="chart-desc-my-svg">Sources and frozen assumptions feed separate exchange, certificate, interface, observation and retention studies. Independent checks support scoped results. The visual laboratory consumes only frozen synthetic contract v1; newer study adapters are not implemented.</desc><style>#my-svg{font-family:Arial;font-size:16px;fill:#172b3a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(26.6666666667, 36%, 100%);}#my-svg .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#607787;stroke:#607787;}#my-svg .marker.cross{stroke:#607787;}#my-svg svg{font-family:Arial;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:Arial;color:#172b3a;}#my-svg .cluster-label text{fill:rgb(0, 0, 0);}#my-svg .cluster-label span{color:rgb(0, 0, 0);}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#172b3a;color:#172b3a;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#eef3f7;stroke:#607787;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#607787!important;stroke-width:0;stroke:#607787;}#my-svg .arrowheadPath{fill:#0b0b0b;}#my-svg .edgePath .path{stroke:#607787;stroke-width:2.0px;}#my-svg .flowchart-link{stroke:#607787;fill:none;}#my-svg .edgeLabel{background-color:#ffffff;text-align:center;}#my-svg .edgeLabel p{background-color:#ffffff;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#my-svg .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#my-svg .cluster rect{fill:#f8fafc;stroke:#c6d1da;stroke-width:1px;}#my-svg .cluster text{fill:rgb(0, 0, 0);}#my-svg .cluster span{color:rgb(0, 0, 0);}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial;font-size:12px;background:hsl(26.6666666667, 36%, 100%);border:1px solid hsl(26.6666666667, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172b3a;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#ffffff;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#ffffff;padding:2px;}#my-svg .icon-shape rect,#my-svg .image-shape rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#my-svg :root{--mermaid-font-family:Arial;}#my-svg .model&gt;*{fill:#eef3f7!important;stroke:#607787!important;color:#172b3a!important;stroke-width:1.4px!important;}#my-svg .model span{fill:#eef3f