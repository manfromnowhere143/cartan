<svg xmlns="http://www.w3.org/2000/svg" class="module-drawing" viewBox="0 0 660 500" width="660" height="500" role="img" aria-labelledby="module-drawing-title module-drawing-desc">
    <title id="module-drawing-title">Module, host and transfer support</title>
    <desc id="module-drawing-desc">An abstract cartridge sits between a host and an independent support. The highlighted region identifies the selected function. The arrangement and spacing explain relationships only: dimensions, latch geometry and physical state are unknown.</desc>
